function show(next){state=next;document.getElementById('frame').innerHTML=screens[next];for(const name of ['normal','proactive'])document.getElementById(name).setAttribute('aria-pressed',String(name===next));document.querySelectorAll('.frame .button').forEach(el=>{el.setAttribute('tabindex','0');el.addEventListener('click',()=>act(el.dataset.action));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(el.dataset.action)}})})}
function openDialog(title,body){previousFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-text').textContent=body;document.getElementById('dialog').hidden=false;document.getElementById('close').focus()}
function closeDialog(){document.getElementById('dialog').hidden=true;if(previousFocus)previousFocus.focus()}
function act(action){if(action==='why'){openDialog('Why this plan?',state==='proactive'?'In this fictional example, current range is 112 km and the remaining route is 148 km. The suggested Cedar Plaza stop adds enough energy for an estimated 24% arrival reserve. The plan stays a proposal until you accept it. Charger availability, cost and all trip figures are illustrative.':'In this fictional example, 72% battery and 288 km estimated range cover the 148 km route with an estimated 38% arrival reserve. No stop is needed; Cedar Plaza remains a backup. These values are illustrations, not a live range prediction.')}else if(action==='accept'){openDialog('Charging stop accepted — demo','This local interaction demonstrates one-tap approval. A real product would recalculate the route and confirm the charger; this prototype does not reserve anything or send data.')}else if(action==='dismiss'){openDialog('Stop dismissed — demo','The proposal is dismissed in this local demonstration. A real product would offer another safe charging option rather than implying the current range covers the whole route.')}else if(action==='play'){openDialog('Media control — demo','This is a visual media-control state. No third-party recording or music service is loaded.')}}
for(const name of ['normal','proactive'])document.getElementById(name).onclick=()=>show(name);
document.getElementById('close').onclick=closeDialog;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='Tab'&&!document.getElementById('dialog').hidden){e.preventDefault();document.getElementById('close').focus()}});show('normal');
