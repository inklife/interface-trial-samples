<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>审阅三份原创作品并签署 TaskMarket 消息</title>
<style>
body{margin:0;background:#f4f6f8;color:#192b3e;font:16px/1.7 system-ui,sans-serif}main{max-width:880px;margin:24px auto;padding:24px;background:white;border:1px solid #d3dde5;border-radius:12px}h1{font-size:26px;margin-top:0}h2{font-size:21px;margin:0}p,pre,strong{overflow-wrap:anywhere}pre{white-space:pre-wrap;padding:12px;background:#f1f4f7;border:1px solid #cbd7e2;border-radius:6px;font:13px/1.6 ui-monospace,monospace}.note{background:#fff4d7;border-left:4px solid #ba8507;padding:12px}button,select{font:inherit;padding:9px 13px;margin:5px 8px 5px 0;border:1px solid #a4b7c8;border-radius:6px;max-width:100%}button{background:#1c4673;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #c78607;outline-offset:3px}.card{padding:18px;margin:20px 0;border:1px solid #cbd7e2;border-radius:10px}a{color:#174c82}textarea{width:100%;box-sizing:border-box;min-height:230px;resize:vertical;font:13px/1.6 ui-monospace,monospace;padding:12px}#status{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:600px){main{margin:8px;padding:16px}h1{font-size:22px}}
</style>
<main>
<h1>审阅三份原创作品，再逐项签名</h1>
<p class="note" id="purpose"></p>
<p>同一目标钱包：<strong id="expected"></strong>。每个任务毛奖金 2 USDC，唯一获胜者扣费后 1.85 USDC；提交不保证获奖或付款。三项截止均为北京时间 2026 年 10 月 2 日约 07:51–07:52。</p>
<p>作品与钱包地址将公开。此页没有转账或代币授权接口，只调用钱包连接、账号查询和 personal_sign；无外部脚本，不自动上传或保存签名。每条消息只用于它显示的 TaskMarket 任务。</p>
<label for="wallet">选择钱包：</label><select id="wallet"><option value="">正在检测…</option></select>
<button id="refresh" type="button">重新检测</button><button id="connect" type="button">连接目标钱包</button>
<p id="status" role="status" aria-live="polite">尚未连接。</p>
<div id="cards"></div>
<label for="signature">将三项签名结果复制回当前 Codex 对话：</label>
<textarea id="signature" readonly placeholder="每签完一项会更新；完成三项后统一复制。"></textarea>
<button id="copy" type="button" disabled>复制全部结果</button>
</main>
<script>
'use strict';
const manifest={"phase": "upload_permission", "address": "0x832c6f4c3ca8d3f0cf2b5d5239c88f9268528a9e", "tasks": [{"task_id": "0xc0a51e82c2c050fbee6de8e6e311deffbc42445493a1299b323a00586d1410f1", "title": "蘑菇电梯交互页", "file_name": "mushroom-lift.html", "file_bytes": 19002, "sha256": "e0e8536812e031322c905d8d930e9572d676807cb432e48cfbd524c5fec37a62", "mime_type": "text/html", "deadline_utc": "2026-10-01T23:51:44.899Z", "task_url": "https://taskmarket.dev/tasks/0xc0a51e82c2c050fbee6de8e6e311deffbc42445493a1299b323a00586d1410f1", "message": "taskmarket:submit:0xc0a51e82c2c050fbee6de8e6e311deffbc42445493a1299b323a00586d1410f1", "gross_reward_usdc": "2.00", "net_reward_usdc_if_winner": "1.85", "winner_only": true, "confirmed_income_usdc": 0}, {"task_id": "0x7f7ce3bc64b53db669e10f6bcb595102e7ed4b5b7f7e1a022f7fd9bac2049f44", "title": "羽毛结构科普图", "file_name": "feather-fastenings.svg", "file_bytes": 12915, "sha256": "e6dffe6fb6f3659204993866b8edf5595157ae819e5666bcefe1e2da7a2247b2", "mime_type": "image/svg+xml", "deadline_utc": "2026-10-01T23:52:09.103Z", "task_url": "https://taskmarket.dev/tasks/0x7f7ce3bc64b53db669e10f6bcb595102e7ed4b5b7f7e1a022f7fd9bac2049f44", "message": "taskmarket:submit:0x7f7ce3bc64b53db669e10f6bcb595102e7ed4b5b7f7e1a022f7fd9bac2049f44", "gross_reward_usdc": "2.00", "net_reward_usdc_if_winner": "1.85", "winner_only": true, "confirmed_income_usdc": 0}, {"task_id": "0x52976d23dd1457972dd9d70dca6063488dd093e4d91f9c984259701f87e51b8e", "title": "五种动物建筑图鉴", "file_name": "animal-architects.svg", "file_bytes": 39235, "sha256": "ce2ccf4c6d3358d0565bec765356571f8f545c01e85e5ef43d9bfc1697cb87c2", "mime_type": "image/svg+xml", "deadline_utc": "2026-10-01T23:51:17.988Z", "task_url": "https://taskmarket.dev/tasks/0x52976d23dd1457972dd9d70dca6063488dd093e4d91f9c984259701f87e51b8e", "message": "taskmarket:submit:0x52976d23dd1457972dd9d70dca6063488dd093e4d91f9c984259701f87e51b8e", "gross_reward_usdc": "2.00", "net_reward_usdc_if_winner": "1.85", "winner_only": true, "confirmed_income_usdc": 0}]};
const expected=manifest.address.toLowerCase(),messageTasks=manifest.tasks;
const el=id=>document.getElementById(id),wallets=[],signatures=new Map();
let provider=null,account=null,busy=false;
el('expected').textContent=expected;
el('purpose').textContent=manifest.phase==='final_submission'?'第二阶段：作品已上传。下面每条最终提交消息绑定相应的上传文件标识，请逐项核对。此次使用免费提交额度，没有付款。':'第一阶段：先审阅下面三个唯一提交文件，并逐项签署上传许可消息。我会用返回的签名上传作品，然后提供绑定已上传文件的最终签名页。这一页的签名尚不完成正式参赛。';
messageTasks.forEach((t,i)=>{
 const card=document.createElement('section');card.className='card';
 const h=document.createElement('h2');h.textContent=(i+1)+'. '+t.title;card.append(h);
 const p=document.createElement('p');const a=document.createElement('a');a.href=t.file_name;a.target='_blank';a.rel='noopener noreferrer';a.textContent='打开已审阅作品：'+t.file_name;p.append(a,document.createTextNode(' · '+t.file_bytes+' 字节'));card.append(p);
 const link=document.createElement('a');link.href=t.task_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='平台原始任务';card.append(link);
 const hash=document.createElement('p');hash.textContent='文件 SHA-256：'+t.sha256;card.append(hash);
 const pre=document.createElement('pre');pre.id='message-'+i;pre.textContent=t.message;card.append(pre);
 const btn=document.createElement('button');btn.id='sign-'+i;btn.type='button';btn.disabled=true;btn.textContent='核对并签署第 '+(i+1)+' 项';btn.onclick=()=>signOne(i);card.append(btn);
 el('cards').append(card);
});
function buttons(){el('connect').disabled=busy||!wallets.length;messageTasks.forEach((t,i)=>{el('sign-'+i).disabled=busy||!account;el('sign-'+i).textContent=signatures.has(t.task_id)?'已签第 '+(i+1)+' 项（可重新核对）':'核对并签署第 '+(i+1)+' 项';});}
function renderResult(){el('signature').value=signatures.size?JSON.stringify({phase:manifest.phase,signatures:messageTasks.filter(t=>signatures.has(t.task_id)).map(t=>({task_id:t.task_id,signature:signatures.get(t.task_id)}))},null,2):'';el('copy').disabled=signatures.size!==messageTasks.length;buttons();}
function reset(){provider=null;account=null;signatures.clear();renderResult();}
function addWallet(p,name){if(!p||typeof p.request!=='function'||wallets.some(w=>w.provider===p))return;wallets.push({provider:p,name:String(name||'浏览器钱包')});renderWallets();}
function renderWallets(){const old=el('wallet').value;el('wallet').replaceChildren();if(!wallets.length){const o=document.createElement('option');o.value='';o.textContent='未发现钱包，请用安装插件的浏览器打开';el('wallet').append(o);}else{wallets.forEach((w,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=w.name;el('wallet').append(o);});if(old!==''&&Number(old)<wallets.length)el('wallet').value=old;}buttons();}
window.addEventListener('eip6963:announceProvider',e=>addWallet(e.detail?.provider,e.detail?.info?.name));
function discover(){window.dispatchEvent(new Event('eip6963:requestProvider'));const e=window.ethereum;if(e?.providers?.length)e.providers.forEach(p=>addWallet(p,p.isBinance?'Binance Wallet':'浏览器钱包'));else addWallet(e,e?.isBinance?'Binance Wallet':'默认钱包');renderWallets();}
el('refresh').onclick=discover;
el('wallet').onchange=()=>{reset();el('status').textContent='钱包选择改变，需重新连接。';};
el('connect').onclick=async()=>{if(busy)return;busy=true;reset();buttons();try{provider=wallets[Number(el('wallet').value)]?.provider;if(!provider)throw Error('没有发现钱包');const a=await provider.request({method:'eth_requestAccounts'});account=a?.find(x=>typeof x==='string'&&x.toLowerCase()===expected);if(!account)throw Error('连接地址不符，请切换到 '+expected);el('status').textContent='地址正确。请逐项审阅作品和完整消息，再点击各项签名。';}catch(e){reset();el('status').textContent=String(e.message||e);}finally{busy=false;buttons();}};
async function signOne(i){if(busy||!provider||!account)return;busy=true;buttons();const t=messageTasks[i];try{const a=await provider.request({method:'eth_accounts'});if(!a?.some(x=>typeof x==='string'&&x.toLowerCase()===expected)){reset();throw Error('钱包账号改变，签名已清空，请重新连接。');}const hex='0x'+Array.from(new TextEncoder().encode(t.message),b=>b.toString(16).padStart(2,'0')).join('');const sig=await provider.request({method:'personal_sign',params:[hex,account]});if(typeof sig!=='string'||!/^0x[0-9a-fA-F]{130}$/.test(sig))throw Error('钱包未返回65字节消息签名');signatures.set(t.task_id,sig);renderResult();el('status').textContent='已完成 '+signatures.size+' / '+messageTasks.length+' 项。'+(signatures.size===messageTasks.length?'请复制全部结果发回 Codex。':'请继续逐项核对。');}catch(e){el('status').textContent=String(e.message||e);}finally{busy=false;buttons();}}
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('signature').value);el('status').textContent='已复制全部签名结果，请粘贴回 Codex。';}catch{el('signature').focus();el('signature').select();el('status').textContent='请手动复制选中的完整结果。';}};
discover();
</script></html>
