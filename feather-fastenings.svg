<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">The secret fastenings of a feather</title>
<desc id="art-desc">An original schematic pennaceous feather has a central rachis and two vanes. A marked patch is connected to an enlarged view: two barbs branch from the shaft, smaller barbules branch from each barb, and hooklets join neighbouring barbules. Three captions explain branching, interlocking, and the contrast with a loose downy region. Different scales are schematic, not measured.</desc>
