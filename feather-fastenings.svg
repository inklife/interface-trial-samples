<rect x="40" y="783" width="295" height="234" rx="16" fill="#e4eee7"/>
<text class="eyebrow" x="57" y="812">01 / BRANCH</text>
<text id="caption-1" class="caption" x="57" y="845">
<tspan x="57" dy="0">A sturdy rachis supports</tspan>
<tspan x="57" dy="24">the vanes. Barbs extend</tspan>
<tspan x="57" dy="24">from this shaft, and finer</tspan>
<tspan x="57" dy="24">barbules branch from those</tspan>
<tspan x="57" dy="24">barbs: a hierarchy of</tspan>
<tspan x="57" dy="24">increasingly delicate</tspan>
<tspan x="57" dy="24">parts.</tspan>
</text>
<rect x="353" y="783" width="295" height="234" rx="16" fill="#ece6ef"/>
<text class="eyebrow" x="370" y="812">02 / CONNECT</text>
<text id="caption-2" class="caption" x="370" y="845">
<tspan x="370" dy="0">In a pennaceous region,</tspan>
<tspan x="370" dy="24">small hooklets on some</tspan>
<tspan x="370" dy="24">barbules engage</tspan>
<tspan x="370" dy="24">neighbouring barbules.</tspan>
<tspan x="370" dy="24">These connections help</tspan>
<tspan x="370" dy="24">adjacent barbs form a</tspan>
<tspan x="370" dy="24">coherent vane.</tspan>
</text>
<rect x="666" y="783" width="295" height="234" rx="16" fill="#f1e6d8"/>
<text class="eyebrow" x="683" y="812">03 / COMPARE</text>
<text id="caption-3" class="caption" x="683" y="845">
<tspan x="683" dy="0">A downy region has a</tspan>
<tspan x="683" dy="24">looser, non-interlocking</tspan>
<tspan x="683" dy="24">arrangement. Many feathers</tspan>
<tspan x="683" dy="24">combine structured and</tspan>
<tspan x="683" dy="24">fluffy regions; this</tspan>
<tspan x="683" dy="24">drawing focuses on a</tspan>
<tspan x="683" dy="24">pennaceous example.</tspan>
</text>
<text class="tiny" x="42" y="1045">Original illustration · Sources and individual claim mappings embedded in SVG metadata</text></svg>
