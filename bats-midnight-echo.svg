  <rect width="1000" height="820" fill="#101b2c"/>
  <path d="M30 154 H970" stroke="#3b4a60" stroke-width="1"/>
  <text x="32" y="49" class="small" fill="#b8c6d9">A LITTLE NIGHT STORY</text>
  <text x="29" y="110" font-size="54" font-weight="650" letter-spacing="-2">A bat’s midnight echo</text>
  <text x="33" y="137" font-size="17" fill="#b8c6d9">One call. One pillar. A returning clue.</text>
  <path d="M926 24 A28 28 0 1 0 951 64 A25 25 0 0 1 926 24Z" fill="#f6dfb4"/>
  <circle cx="881" cy="31" r="1.8" fill="#f6dfb4"/><path d="M974 43 V53 M969 48 H979" stroke="#b8c6d9" stroke-width="1.5"/>
  <g aria-label="Sound color key">
    <path d="M720 125 H751" stroke="#efb969" stroke-width="2" marker-end="url(#arrow-out)"/><text x="760" y="130" font-size="13" fill="#efb969">call</text>
    <path d="M866 125 H835" stroke="#75d5c8" stroke-width="2" marker-end="url(#arrow-back)"/><text x="877" y="130" font-size="13" fill="#75d5c8">echo</text>
  </g>

  <g id="panel-1" class="illustrated-panel" transform="translate(30 178)" aria-label="Panel one: sound emitted">
    <rect width="300" height="420" rx="18" fill="#1a2a40" stroke="#40526b"/>
    <text x="22" y="34" class="small" fill="#efb969">01 / EMIT</text>
    <text x="22" y="63" class="chapter">A question in the dark.</text>
    <use href="#night-details"/>
    <use href="#bat-character" transform="translate(79 174)"/>
    <use href="#stone-pillar" transform="translate(243 106)"/>
    <g class="wave out" aria-label="Gold emitted sound moving right">
      <path d="M121 156 Q134 174 121 192"/>
      <path d="M139 147 Q158 174 139 201"/>
      <path d="M159 136 Q186 174 159 212"/>
      <path d="M116 225 H180" stroke-width="2" marker-end="url(#arrow-out)"/>
    </g>
    <text x="115" y="258" class="sound-label" fill="#efb969">OUTGOING CALL</text>
    <path d="M22 280 H278" stroke="#40526b"/>
    <text id="caption-1" x="22" y="315" class="caption"><tspan x="22">I send a short sound into the </tspan><tspan x="22" dy="25">night; the old stone pillar has </tspan><tspan x="22" dy="25">not answered yet.</tspan></text>
    <path d="M22 397 H67" stroke="#efb969" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="panel-2" class="illustrated-panel" transform="translate(350 178)" aria-label="Panel two: sound reaches and reflects from the same pillar">
    <rect width="300" height="420" rx="18" fill="#1a2a40" stroke="#40526b"/>
    <text x="22" y="34" class="small" fill="#efb969">02 / REFLECT</text>
    <text x="22" y="63" class="chapter">The stone answers.</text>
    <use href="#night-details"/>
    <use href="#bat-character" transform="translate(79 174)"/>
    <use href="#stone-pillar" transform="translate(243 106)"/>
    <g class="wave out" aria-label="Gold outgoing sound reaches the pillar's left surface">
      <path d="M189 139 Q215 174 189 209"/>
      <path d="M208 145 Q229 174 208 203"/>
      <path d="M113 125 H224" stroke-width="2" marker-end="url(#arrow-out)"/>
    </g>
    <path d="M221 161 Q212 174 221 187" class="wave back"/>
    <path d="M222 225 H195" class="wave back" stroke-width="2" marker-end="url(#arrow-back)"/>
    <circle cx="225" cy="174" r="3.5" fill="#f6efdf"/>
    <text x="109" y="258" class="sound-label" fill="#efb969">SOUND MEETS STONE</text>
    <path d="M22 280 H278" stroke="#40526b"/>
    <text id="caption-2" x="22" y="315" class="caption"><tspan x="22">My outgoing sound reaches the </tspan><tspan x="22" dy="25">same stone pillar. Its surface </tspan><tspan x="22" dy="25">reflects part of the sound </tspan><tspan x="22" dy="25">back toward me.</tspan></text>
    <path d="M22 397 H67" stroke="#efb969" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="panel-3" class="illustrated-panel" transform="translate(670 178)" aria-label="Panel three: reflected sound returns leftward to the bat's ears">
    <rect width="300" height="420" rx="18" fill="#1a2a40" stroke="#40526b"/>
    <text x="22" y="34" class="small" fill="#75d5c8">03 / RECEIVE</text>
    <text x="22" y="63" class="chapter">My voice, back again.</text>
    <use href="#night-details"/>
    <use href="#bat-character" transform="translate(79 174)"/>
    <use href="#stone-pillar" transform="translate(243 106)"/>
    <g class="wave back" aria-label="Teal returning echo moves left from the pillar to the bat's ears">
      <path d="M186 136 Q159 174 186 212"/>
      <path d="M153 146 Q132 174 153 202"/>
      <path d="M119 157 Q107 174 119 191"/>
      <path d="M222 125 H94" stroke-width="2" marker-end="url(#arrow-back)"/>
    </g>
    <path d="M94 129 L95 137" stroke="#75d5c8" stroke-width="2" stroke-linecap="round"/>
    <text x="115" y="258" class="sound-label" fill="#75d5c8">RETURNING ECHO</text>
    <path d="M22 280 H278" stroke="#40526b"/>
    <text id="caption-3" x="22" y="315" class="caption"><tspan x="22">Here comes my echo, returning </tspan><tspan x="22" dy="25">to my ears. The pause after my </tspan><tspan x="22" dy="25">call helps me judge the pillar’s </tspan><tspan x="22" dy="25">distance.</tspan></text>
    <path d="M22 397 H67" stroke="#75d5c8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="34" y="630" class="small" fill="#b8c6d9">THE SCIENCE BEHIND THE STORY</text>
  <rect x="30" y="647" width="940" height="132" rx="16" fill="#203547" stroke="#496170"/>
  <path d="M52 672 V751" stroke="#75d5c8" stroke-width="3" stroke-linecap="round"/>
  <text id="factual-footer" x="72" y="680" font-size="20"><tspan x="72">These paths simplify sound spreading and reflection. The elapsed time between </tspan><tspan x="72" dy="29">a call and its echo provides a distance cue. Call patterns differ among bat species. </tspan><tspan x="72" dy="29">This sequence is schematic, not a measured timeline.</tspan></text>
  <text x="970" y="804" text-anchor="end" font-size="12" fill="#9cacc1">Original vector story · Scientific source mapping embedded in SVG metadata</text>
</svg>
