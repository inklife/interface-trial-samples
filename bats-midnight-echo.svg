  "work": "A bat's midnight echo",
  "originality": "Original character, pillar, vector geometry, composition and prose; no source artwork or diagrams reproduced.",
  "sources": {
    "NPS": {"url": "https://www.nps.gov/subjects/bats/echolocation.htm", "publisher": "U.S. National Park Service", "title": "Echolocation", "updated": "2024-10-17"},
    "Brown": {"url": "https://archive2.news.brown.edu/1987-2007/1998-99/98-026.html", "publisher": "Brown University News Bureau", "title": "Bat sonar sharper than thought; much better than man-made gear", "published": "1998-10-12"}
  },
  "claim_mapping": [
    {"claim": "Elapsed call-to-echo time provides a distance cue.", "location": "factual-footer and caption-3", "source": "Brown", "support": "The university account explains that timing of returning echoes is used to determine distance to a structure or target."},
    {"claim": "Call patterns differ among bat species.", "location": "factual-footer", "source": "NPS", "support": "The government page explains that bat species have differing call patterns."},
    {"claim": "An echolocating bat emits sound.", "location": "panel-1, caption-1, gold outgoing arrow and waves", "source": "NPS", "support": "The page describes sound waves emitted by bats."},
    {"claim": "Emitted sound reaches an object and part of it is reflected.", "location": "panel-2, caption-2, gold waves at the pillar and short teal returning arrow", "source": "NPS", "support": "The page describes emitted sound bouncing off environmental objects."},
    {"claim": "Reflected sound returns to the bat's ears as an echo.", "location": "panel-3, caption-3, teal leftward arrow and wavefronts", "source": "NPS", "support": "The page describes sounds returning to bats' ears."}
  ],
  "representation": "This imagined bat is echolocating; no universal claim is made about all bats. The pillar is inanimate and unchanged. Wavefronts, arrows, spacing and stages are schematic simplifications of sound spreading and reflection, not a measured timeline or light. A single reflected route is illustrated; other spreading sound is omitted for clarity.",
  "source_access_date_UTC": "2026-09-30",
