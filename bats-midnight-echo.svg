<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" fill="#f6efdf" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">A bat's midnight echo: one call, one pillar, a returning clue</title>
  <desc id="art-desc">Three original night-time illustrations follow the same imagined echolocating bat beside the same stone pillar. Gold sound waves travel from the bat to the pillar; teal reflected sound travels left from the pillar to the bat's ears. Captions and a factual footer distinguish emitted sound from its returning echo. Arrows show schematic sound paths, not light rays or a measured timeline.</desc>
